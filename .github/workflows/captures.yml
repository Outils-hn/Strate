# Check-up et captures d'ecran pour la revue visuelle : sur chaque branche (sauf main),
# l'appli est ouverte dans un navigateur ; resultats publies sur la branche « captures/<branche> ».
name: Captures
on:
  push:
    branches-ignore: [main, "captures/**"]
permissions:
  contents: write
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium && sudo apt-get install -y poppler-utils
      - name: Lancer l'appli et verifier
        run: |
          mkdir -p out
          (python3 -m http.server 8090 > /dev/null 2>&1 &)
          sleep 2
          node e2e/checkup.mjs out || true
          if [ -f out/bon.pdf ]; then pdftoppm -png -r 70 out/bon.pdf out/bon-page; fi
          grep -c "^ECHEC" out/checkup.txt | xargs -I{} echo "::notice::Check-up Strate : {} echec(s)"
          grep "^ECHEC" out/checkup.txt | while IFS= read -r l; do echo "::warning::$l"; done
      - name: Publier sur la branche captures
        run: |
          cd out
          git init -q -b "captures/${GITHUB_REF_NAME}"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Captures de ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/captures/${GITHUB_REF_NAME}"
